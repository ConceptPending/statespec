[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statespec"
version = "0.4.0"
description = "Declarative lifecycle state-machine specs: one enforcement path, policy identity digests, semantic diffs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Nick Williamson", email = "nick@nickw.info" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/ConceptPending/statespec"

# Mirrors baseplate's conservative baseline — the kernel source is extracted
# verbatim from the statespec-v0.3.0 tag and style churn would obscure provenance.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
